dependencies:
  pre:
    - wget -c -O ~/assets/cov-analysis-linux64-7.6.0.tar.gz http://sd-55475.dedibox.fr/cov-analysis-linux64-7.6.0.tar.gz
    - wget -c -O ~/assets/libspotify-12.1.51-Linux-x86_64-release.tar.gz https://developer.spotify.com/download/libspotify/libspotify-12.1.51-Linux-x86_64-release.tar.gz
    - tar xvfz ~/assets/libspotify-12.1.51-Linux-x86_64-release.tar.gz
    - cd libspotify-12.1.51-Linux-x86_64-release && sudo make prefix=/usr/local install
    - sudo apt-get install cmake
    - sudo apt-get install libpng12-dev 
    - sudo apt-get install libgtk2.0-dev 
    - sudo apt-get install librsvg2-bin 
    - sudo apt-get install libfreetype6-dev
    - sudo apt-get install libdbus-glib-1-dev
    - sudo apt-get install g++
    - sudo apt-get install libjansson-dev
    - ls 
    - ls navit
    - bash ~/navit/build.sh
  cache_directories:
    - "~/assets/"
test:
  post:
    - sed -i -e 's@type="internal" enabled@type="internal" fullscreen="1" font_size="350" enabled@' navit.xml:
        pwd: navit/bin/navit/
    - sed -i -e 's@libbinding_dbus.so" active="no"@libbinding_dbus.so" active="yes"@' navit.xml:
        pwd: navit/bin/navit/
    - ./navit:
        pwd: navit/bin/navit/
        background: true
    - sleep 5
    - import -window root $CIRCLE_ARTIFACTS/default.png
    - ./test_route.sh $CIRCLE_ARTIFACTS
    - dbus-send  --print-reply --session --dest=org.navit_project.navit /org/navit_project/navit/default_navit org.navit_project.navit.navit.quit
