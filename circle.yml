machine:
  services:
    - docker
  pre:
    - mkdir ~/assets/
    - curl -k -L -o ~/assets/planet-150202.osm.bz2 ftp://ftp.spline.de/pub/openstreetmap/planet/2015/planet-150202.osm.bz2
#    - cd ~/assets/ && bunzip2 -vv -k planet-150202.osm.bz2
dependencies:
  cache_directories:
    - "~/assets/"
    - "~/docker"
  override:
    - if [[ -e ~/docker/image.tar ]]; then docker load -i ~/docker/image.tar; fi
    - docker build -t navit/circleci .
    - mkdir -p ~/docker; docker save circleci/elasticsearch > ~/docker/image.tar
  pre:
    - sudo apt-get install cmake zlib1g-dev libpng12-dev libgtk2.0-dev librsvg2-bin g++


