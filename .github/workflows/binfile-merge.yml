name: Binfile overlap tests

on:
  push:
    paths:
      - 'contrib/binfile/**'
      - '.github/workflows/binfile-merge.yml'
  pull_request:
    paths:
      - 'contrib/binfile/**'
      - 'navit/maptool/**'
      - 'navit/map/binfile/**'
      - 'navit/route.c'
      - 'navit/attr_def.h'
      - 'navit/item_def.h'
      - '.github/workflows/binfile-merge.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config libglib2.0-dev zlib1g-dev libprotobuf-c-dev protobuf-c-compiler
      - name: Build maptool and the production binfile reader
        run: |
          cmake -S . -B build-merge -G Ninja -DSAMPLE_MAP=OFF -DDISABLE_QT=ON -DDISABLE_CXX=ON -DSVG2PNG=OFF
          cmake --build build-merge --target maptool map_binfile -j 4
      - name: Check merged geometry and native routing
        env:
          NAVIT_BUILD: ${{ github.workspace }}/build-merge
        run: python3 -m unittest discover -s contrib/binfile/tests -v
      - name: Compare adjoining real OSM chunks, searches and ZIP64 offsets
        run: python3 contrib/binfile/validate_chunks.py --build build-merge --output acceptance --large-offsets
      - name: Keep the tested map and acceptance report
        uses: actions/upload-artifact@v7
        with:
          name: adjoining-chunk-proof
          path: |
            acceptance/combined.bin
            acceptance/reference/map.bin
            acceptance/validation.json
            acceptance/*/resources.txt
            acceptance/*/maptool.log
          if-no-files-found: error
          retention-days: 7
